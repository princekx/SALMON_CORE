name: "Cold Surge Forecast"
description: "Runs Cold Surge index computation for MOGREPS and GPM models."

defaults:
  models:
    - mogreps
    - gpm

tasks:
  - name: "Retrieve Cold Surge Data"
    module: salmon.modules.coldsurge.tasks
    class: RetrieveMogrepsColdSurgeData
    config:
      members: 36
      query: "mogreps_combined.query"
    
  - name: "Compute Cold Surge Indices"
    module: salmon.modules.coldsurge.tasks
    class: ComputeMogrepsColdSurgeIndices

  - name: "Generate Cold Surge Plots"
    module: salmon.modules.coldsurge.tasks
    class: DisplayMogrepsColdSurgeMaps

  - name: "Retrieve GPM Cold Surge Data"
    module: salmon.modules.coldsurge.tasks
    class: RetrieveGPMColdSurgeData

  - name: "Generate GPM Cold Surge Plots"
    module: salmon.modules.coldsurge.tasks
    class: DisplayGPMColdSurgeMaps
